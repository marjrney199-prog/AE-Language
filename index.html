<!DOCTYPE html>
<html lang="pt">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description" content="EA LANGUAGE HUB — Aprenda. Traduza. Comunique. Ferramentas linguísticas offline e gratuitas.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0A2342">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EA Language Hub">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>EA LANGUAGE HUB</title>
  <style>
    html, body { height: 100%; margin: 0; background: #0A2342; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .boot { min-height: 100%; display: grid; place-items: center; color: #fff; }
    .boot-card { display: grid; justify-items: center; gap: 14px; text-align: center; padding: 24px; }
    .boot img { width: 100px; height: 100px; }
    .boot strong { letter-spacing: .08em; }
    .boot small { color: #d4af37; }
    .boot span { width: 22px; height: 22px; border: 2px solid #ffffff50; border-top-color: #D4AF37; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .boot span { animation: none; } }
  </style>
</head>
<body>
  <div class="boot" id="boot" aria-label="A iniciar EA Language Hub">
    <div class="boot-card">
      <img src="icons/icon-192.png" alt="">
      <strong>EA LANGUAGE HUB</strong>
      <small>Aprenda. Traduza. Comunique.</small>
      <span aria-hidden="true"></span>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) boot.remove();
    });
    window.setTimeout(function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      var spinner = boot.querySelector('span');
      if (spinner) spinner.remove();
      var notice = document.createElement('p');
      notice.textContent = 'A aplicação está a demorar. Verifique o armazenamento do navegador e recarregue a página.';
      notice.style.maxWidth = '320px';
      notice.style.lineHeight = '1.5';
      boot.querySelector('.boot-card').appendChild(notice);
    }, 10000);
    function startFlutter() {
      var script = document.createElement('script');
      script.src = 'flutter_bootstrap.js';
      script.async = true;
      document.body.appendChild(script);
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(function () { return navigator.serviceWorker.ready; })
        .then(startFlutter)
        .catch(startFlutter);
    } else {
      startFlutter();
    }
  </script>
</body>
</html>
